name: Automated Windows Cloud Compilation Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Compile Standalone Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Standard Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 nuitka numpy opencv-python-headless pillow ai-edge-litert annoy mediapipe yt-dlp kagglehub

      # CORE FIX: Deletes the massive class index so MSVC doesn't run out of heap space
      - name: Strip Heavy Static Extractors from yt-dlp
        run: |
          python -c "import os, yt_dlp.extractor.lazy_extractors as l; p = l.__file__; os.remove(p); print(f'Successfully stripped: {p}')"

      - name: Execute Nuitka Direct Compilation
        run: |
          python -m nuitka --standalone --plugin-enable=pyside6 --include-qt-plugins=iconengines,imageformats,multimedia,platforms --include-package=mediapipe --nofollow-import-to=matplotlib --include-data-dir=models=models --include-data-files=style.qss=style.qss --low-memory --lto=no --assume-yes-for-downloads --output-dir=build main.py

      - name: Upload Compiled Application Bundle
        uses: actions/upload-artifact@v4
        with:
          name: DriverApp-Windows
          path: build/main.dist
          if-no-files-found: error