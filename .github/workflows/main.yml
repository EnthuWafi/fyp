name: Automated Windows Production Deployment

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Compile Standalone Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Initialize Standard Python 3.12 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Application System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 nuitka numpy pillow ai-edge-litert annoy mediapipe yt-dlp kagglehub

      - name: Strip OpenCV Contrib Binaries
        run: |
          pip uninstall -y opencv-contrib-python opencv-python-headless
          pip install opencv-python-headless

      - name: Patch yt-dlp Extractor Memory Overhead
        run: |
          python -c "import os, yt_dlp.extractor.lazy_extractors as l; p = l.__file__; os.remove(p); print(f'Successfully stripped: {p}')"

      # FIXED: Custom flags are now provided as individual native action options
      - name: Build Windows Executable Bundle
        uses: Nuitka/Nuitka-Action@main
        env:
          NUITKA_EXTRA_OPTIONS: "--include-qt-plugins=iconengines,imageformats,multimedia,platforms"
        with:
          script-name: main.py
          output-dir: build
          output-file: DriverMusicRegulator.exe
          mode: standalone
          enable-plugins: pyside6
          include-package: mediapipe
          include-data-dir: models=models
          include-data-files: style.qss=style.qss
          low-memory: true
          lto: "no"
          nofollow-import-to: matplotlib

      - name: Bundle System ICU Dependencies
        shell: powershell
        run: |
          Copy-Item -Path "C:\Windows\System32\icuuc.dll" -Destination "build/main.dist\" -ErrorAction SilentlyContinue
          Copy-Item -Path "C:\Windows\System32\icuin.dll" -Destination "build/main.dist\" -ErrorAction SilentlyContinue
          
      - name: Archive and Upload Production Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DriverMusicRegulator-Windows
          path: build/main.dist
          if-no-files-found: error